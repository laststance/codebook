# c8 reports paths relative to extension/; map them onto the repository tree.
fixes:
  - '^src/::extension/src/'

codecov:
  notify:
    # One upload per shard of .github/workflows/test.yml; report only when all of them have arrived.
    after_n_builds: 14

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%

comment:
  layout: 'reach,diff,flags,files'
  behavior: default
  after_n_builds: 14
