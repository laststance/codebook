name: Build, test and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede old PR runs, but preserve package evidence for every distinct non-PR commit.
  group: package-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: extension/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
          cache: pnpm
          cache-dependency-path: |
            extension/pnpm-lock.yaml
            extension/pnpm-workspace.yaml
      - name: Test project compaction hook
        run: node --test .codex/restore-product-context.test.mjs
      - name: Install pinned dependencies
        run: |
          pnpm --dir extension install --frozen-lockfile
      - name: Compile extension and regression suites
        run: |
          pnpm --dir extension build
      # The product suite runs once, in the Test workflow, on an emit made without type checking.
      # This comparison proves those tests run the same bytes the compiler writes here.
      - name: Compare the Test workflow's unchecked emit with the compiler output
        run: node extension/scripts/build-fast.mjs --check
      - name: Run actual package and failure regressions
        run: pnpm --dir extension test:package
      - name: Produce and verify private VSIX
        run: |
          mkdir -p artifacts/packages
          node extension/scripts/package.mjs --out artifacts/packages/codebook.vsix > artifacts/packages/build-receipt.json
          node extension/scripts/check-package.mjs artifacts/packages/codebook.vsix > artifacts/packages/verification.json
          node -e 'const fs = require("node:fs"), assert = require("node:assert/strict"); for (const path of ["build-receipt.json", "verification.json"]) assert.equal(JSON.parse(fs.readFileSync("artifacts/packages/" + path)).build.dirty, false, "CI packages require clean provenance");'
          cd artifacts/packages
          sha256sum codebook.vsix > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codebook-vsix-${{ github.sha }}
          path: |
            artifacts/packages/codebook.vsix
            artifacts/packages/build-receipt.json
            artifacts/packages/verification.json
            artifacts/packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
