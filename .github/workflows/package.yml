name: Build, test and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede old PR runs, but preserve package evidence for every distinct non-PR commit.
  group: package-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: extension/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: |
            extension/pnpm-lock.yaml
            extension/pnpm-workspace.yaml
            experiments/cycle-0001/pnpm-lock.yaml
            experiments/cycle-0004/pnpm-lock.yaml
            experiments/cycle-0010/pnpm-lock.yaml
      - name: Install pinned dependencies
        run: |
          pnpm --dir experiments/cycle-0001 install --frozen-lockfile
          pnpm --dir experiments/cycle-0004 install --frozen-lockfile
          pnpm --dir experiments/cycle-0010 install --frozen-lockfile
          pnpm --dir extension install --frozen-lockfile
      - name: Compile extension and regression suites
        run: |
          pnpm --dir experiments/cycle-0010 build
          pnpm --dir extension build
      - name: Run product and shared runtime tests
        run: node --test extension/dist/tests/*.test.js experiments/cycle-0001/dist/tests/*.test.js experiments/cycle-0004/dist/tests/*.test.js experiments/cycle-0010/dist/tests/*.test.js
      - name: Run actual package and failure regressions
        run: pnpm --dir extension test:package
      - name: Produce and verify private VSIX
        run: |
          mkdir -p artifacts/packages
          node extension/scripts/package.mjs --out artifacts/packages/codebook.vsix > artifacts/packages/build-receipt.json
          node extension/scripts/check-package.mjs artifacts/packages/codebook.vsix > artifacts/packages/verification.json
          node -e 'const fs = require("node:fs"), assert = require("node:assert/strict"); for (const path of ["build-receipt.json", "verification.json"]) assert.equal(JSON.parse(fs.readFileSync("artifacts/packages/" + path)).build.dirty, false, "CI packages require clean provenance");'
          cd artifacts/packages
          sha256sum codebook.vsix > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codebook-vsix-${{ github.sha }}
          path: |
            artifacts/packages/codebook.vsix
            artifacts/packages/build-receipt.json
            artifacts/packages/verification.json
            artifacts/packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
