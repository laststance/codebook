name: Fallow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fallow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fallow:
    # One job for the three checks, so a push stays below the 20 concurrent jobs of the plan (the Test workflow alone
    # starts fourteen). dupes and dead-code take about a second each; health builds again and runs the complete suite
    # under c8 for its coverage (75 s on a 16-CPU Ubuntu host), so it sets this job's time.
    name: Fallow (health, dupes, dead-code)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare environment
        uses: ./.github/actions/prepare

      # Package and native-QA scripts import the compiled extension from dist; build it so those imports resolve.
      - name: Build
        id: build
        run: pnpm --dir extension build

      # scripts/checkHealth.mjs: score health with this run's own coverage against the pre-repair measured baseline;
      # stale, mixed, failed or partial evidence is refused (exit 2) instead of scored.
      - name: Run measured fallow health
        run: pnpm --dir extension health

      # A failed check does not hide the result of the next one.
      - name: Run fallow dupes
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --dir extension dupes

      - name: Run fallow dead-code
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --dir extension dead-code
