name: Fallow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fallow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fallow:
    # One job for the three checks: each takes about a second after a 30-second setup and build, and a push
    # must stay below the 20 concurrent jobs of the plan (the Test workflow alone starts twelve).
    name: Fallow (health, dupes, dead-code)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare environment
        uses: ./.github/actions/prepare

      # Package and native-QA scripts import the compiled extension from dist; build it so those imports resolve.
      - name: Build
        id: build
        run: pnpm --dir extension build

      - name: Run fallow health
        run: pnpm --dir extension health

      # A failed check does not hide the result of the next one.
      - name: Run fallow dupes
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --dir extension dupes

      - name: Run fallow dead-code
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --dir extension dead-code
