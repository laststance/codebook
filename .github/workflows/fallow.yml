name: Fallow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fallow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health-shard:
    # One third of the compiled test files, measured with V8 coverage and no report (checkHealth.mjs --shard i/N). The files
    # are balanced by test-timings.json; health-merge pools the three dumps folders and scores them as one run would.
    name: Fallow health shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The shard total below (3) and these entries change together.
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare environment
        uses: ./.github/actions/prepare

      - name: Measure this shard of the suite
        run: pnpm --dir extension health --shard ${{ matrix.shard }}/3 --out "$RUNNER_TEMP/health-shard"

      - name: Keep the shard's coverage dumps and manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: health-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/health-shard
          if-no-files-found: error
          retention-days: 1

  health-merge:
    # Builds again (its dist tree and checkout path must equal the shards'), validates every shard result, pools the dumps
    # with one c8 report and scores health against the measured baseline. Cycle 0094 task 11 replaced the single measured
    # run with these jobs after one CI run gave the same Fallow health report for both (decision D16, Issue 241).
    name: Fallow health merge
    needs: [health-shard]
    # Also after a failed shard: the merge refuses a missing or failed shard itself, so the failure shows on this job too.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare environment
        uses: ./.github/actions/prepare

      - name: Download the shards' results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: health-shard-*
          path: ${{ runner.temp }}/health-shards

      - name: Merge the shards and score health
        run: pnpm --dir extension health --merge "$RUNNER_TEMP/health-shards"

  dupes:
    # Reads the source only (no build): about a second of analysis after the shared setup.
    name: Fallow dupes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare environment
        uses: ./.github/actions/prepare

      - name: Run fallow dupes
        run: pnpm --dir extension dupes

  dead-code:
    # Reads the source only (no build): about a second of analysis after the shared setup.
    name: Fallow dead-code
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare environment
        uses: ./.github/actions/prepare

      - name: Run fallow dead-code
        run: pnpm --dir extension dead-code

  architecture:
    # Import cycles against fallow-architecture-baseline.json: no new cycle may appear.
    name: Fallow architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare environment
        uses: ./.github/actions/prepare

      - name: Run fallow architecture
        run: pnpm --dir extension architecture

  analyses:
    # The other free local Fallow analyses, side by side in one job (parallel steps) instead of a job each: the plan
    # runs 20 jobs at once. audit gates the change against its base with the committed baselines; flags, security,
    # similar-code and suppressions are candidate or discovery output for the job summary and never fail the job.
    name: Fallow analyses
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The change's base: the pull request's base commit, or the commit before a push to main (Fallow reads it).
      FALLOW_AUDIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base commit must be in the clone for the changed-code scope.
          fetch-depth: 0

      - name: Prepare environment
        uses: ./.github/actions/prepare

      - parallel:
          # Gates: a dead-code, complexity or duplication finding the change introduces fails the job; inherited ones are listed.
          - name: Run fallow audit
            # An explicit bash runs with pipefail, so audit's exit status survives the pipe to tee and the step gates.
            shell: bash
            # CRAP needs coverage, which the measured health job owns; without it audit would score a static estimate, as health:static avoids with the same option.
            run: >-
              pnpm --dir extension exec fallow audit --dead-code-baseline fallow-dead-code-baseline.json
              --dupes-baseline fallow-dupes-baseline.json --health-baseline fallow-health-baseline.json
              --max-crap inf --format markdown | tee -a "$GITHUB_STEP_SUMMARY"

          - name: Report fallow flags
            run: |
              pnpm --dir extension exec fallow flags --format markdown >> "$GITHUB_STEP_SUMMARY" ||
                echo "::warning::fallow flags ended with $?"

          - name: Report fallow security candidates
            run: |
              {
                echo '## Fallow security candidates (unverified)'
                echo '```text'
                pnpm --dir extension exec fallow security --summary || echo "fallow security ended with $?"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"

          # The pinned local model (Apache-2.0) is downloaded on the runner with explicit non-interactive consent.
          - name: Report fallow similar code
            run: |
              {
                echo '## Fallow similar code (candidates)'
                echo '```text'
                pnpm --dir extension exec fallow similar-code setup --local --yes --quiet &&
                  pnpm --dir extension exec fallow similar-code ||
                  echo "fallow similar-code ended with $?"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"

          - name: Report fallow suppressions
            run: |
              {
                echo '## Fallow suppressions'
                echo '```text'
                pnpm --dir extension exec fallow suppressions --summary || echo "fallow suppressions ended with $?"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
