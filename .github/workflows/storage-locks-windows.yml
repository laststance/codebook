  pull_request:
    branches: [main]
    # The same filter as for a push: a YAML alias of the list above, so the two cannot differ.
    paths: *lock-test-paths
  # Mondays at 05:17 UTC, on main: what the path filter leaves out (the lock's constants, the lockfile, the build).
  schedule:
    - cron: '17 5 * * 1'
  # A manual run, for the job's first run and for a look at Windows without a change to the files above.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-locks-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storage-locks-windows:
    name: File system and process tests on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # The repository has no .gitattributes, and Git for Windows would check text files out with CRLF line endings, also
      # the dependency patch that pnpm applies to files with LF line endings.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The job starts rarely, so it keeps no cache of extension/node_modules as the Test workflow does: each run links
      # the dependencies again, from the pnpm store that setup-node caches per operating system (a Windows store of its own).
      - name: Prepare environment
        uses: ./.github/actions/prepare

      # The command of `pnpm build:fast`; it writes the build metadata itself. Type errors are reported by the TypeCheck
      # and Build workflows.
      - name: Emit the compiled tests without type checking
        working-directory: extension
        run: node scripts/build-fast.mjs

      # One test file at a time: these tests start PowerShell and read real process starts, which the product bounds at
      # 3 s, and on a runner that runs several files side by side such a read went past that bound (run 37321685601). The
      # files' times then add up instead of running beside each other, which is seconds for this job.
      - name: Run the file system and process tests
        working-directory: extension
        run: node --test --test-concurrency=1 dist/tests/withStorageLock.test.js dist/tests/isProcessGone.test.js dist/tests/currentStorageOwner.test.js dist/tests/isFromEarlierBoot.test.js dist/tests/isSameStorageMachine.test.js dist/tests/readBootIdentity.test.js dist/tests/readProcessStart.test.js dist/tests/isRecordedOwnerGone.test.js dist/tests/readRecordedOwner.test.js dist/tests/removeStaleStorageLock.test.js dist/tests/removeStaleStorageClaims.test.js dist/tests/canJudgeOwnerHere.test.js dist/tests/claimWikiUpdateMarker.test.js dist/tests/readLiveWikiUpdateMarker.test.js dist/tests/processStartFormHere.test.js dist/tests/namesMachineInClear.test.js dist/tests/readWikiRegularFile.test.js dist/tests/openWithoutFollowing.test.js dist/tests/hashFileSha256.test.js dist/tests/refreshCursorMcpCatalogFileIdentity.test.js dist/tests/listProcesses.test.js dist/tests/dropSecondNameOfMovedFile.test.js dist/tests/removeWithoutFollowing.test.js dist/tests/listFolderTreeWithoutFollowing.test.js dist/tests/isFolderOfItsOwn.test.js dist/tests/runBoundedQuery.test.js dist/tests/runtime-profileProcesses.test.js dist/tests/removeAbandonedProfiles.test.js dist/tests/isProgramFile.test.js

      # The packaging scripts read a VSIX through their own copy of the opener that refuses a link
      # (extension/scripts/utils/openWithoutFollowing.mjs, which says why it is a copy); its tests run here on the system
      # whose open has no flag to refuse a link with. They are scripts, so they need no build, and they run one file at a
      # time as above.
      - name: Run the tests of the scripts' opener
        working-directory: extension
        run: node --test --test-concurrency=1 scripts/tests/openWithoutFollowing.test.mjs
