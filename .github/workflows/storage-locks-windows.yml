name: Windows file system and process tests

# The storage lock is taken over with a hard link, a directory rename onto an existing directory, a process probe and a
# query for the start of a process (PowerShell on Windows), which Windows answers differently from Linux; the Test
# workflow runs on Linux only. The marker of a Wiki update is created, claimed and judged with the same calls. Windows
# also gives no open flag to refuse a link with: there the opener of every file Codebook must not read through a link
# looks at the path first and opens only the file it looked at. The reader of Wiki metadata files, the file hash and the
# Cursor MCP catalog open through it, and the catalog tells a file by an id that can lie above what a number holds. What
# Codebook removes at the marker's and the lock's paths it removes by a walk of its own, which unlinks a link (a
# junction here) as a name, and it lists the Wiki's output folder only where a real directory stands at that path. The
# list of processes comes from PowerShell here, where no ps exists. The sweep of abandoned browser profiles has no user
# id to judge a folder by here: it judges each folder of the user's own root by its marker and by that list of
# processes, and follows no junction. Git is looked for on PATH, where a file counts as a program by what the file
# system answers for it, with no execute permission to ask: a regular file does, a folder or a junction to one does not.
# This job runs the tests of the storage lock and its owner's identity, of the Wiki update marker and its claim, of the
# reader of Wiki metadata files, of the opener that refuses a link, of the file hash, of the Cursor MCP catalog's opens
# and file ids, of the recovery that puts a moved file back, of the process listing, of the removal walk, of the folder
# listing, of the sweep of abandoned browser profiles and of the program check of the search for Git, on Windows, one
# test file at a time, whenever a file those tests load, or the Node release they run on, changes. Two files those tests
# load are left out of the filter, extension/src/constants.ts and extension/src/runtimeSupport/constants.ts, although
# the first holds the lock's times, its path and its file modes: they change with most pull requests. A change there, to
# the lockfile or to the build that emits the tests is seen by the weekly run instead, within a week of reaching main.
on:
  push:
    branches: [main]
    paths: &lock-test-paths
      - .github/workflows/storage-locks-windows.yml
      - .node-version
      - extension/scripts/tests/openWithoutFollowing.test.mjs
      - extension/scripts/utils/openWithoutFollowing.mjs
      - extension/scripts/utils/packageConstants.mjs
      - extension/scripts/utils/readVsixBytes.mjs
      - extension/src/runtimeSupport/utils/linuxCommandLineArguments.ts
      - extension/src/runtimeSupport/utils/listProcesses.ts
      - extension/src/runtimeSupport/utils/profileProcesses.ts
      - extension/src/runtimeSupport/utils/removeAbandonedProfiles.ts
      - extension/src/runtimeSupport/utils/sha256.ts
      - extension/src/runtimeSupport/utils/windowsCommandLineArguments.ts
      - extension/src/tests/canJudgeOwnerHere.test.ts
      - extension/src/tests/claimWikiUpdateMarker.test.ts
      - extension/src/tests/currentStorageOwner.test.ts
      - extension/src/tests/dropSecondNameOfMovedFile.test.ts
      - extension/src/tests/hashFileSha256.test.ts
      - extension/src/tests/isFolderOfItsOwn.test.ts
      - extension/src/tests/isFromEarlierBoot.test.ts
