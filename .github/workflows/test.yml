name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    # V8 coverage makes the full suite several times slower than package.yml's plain run.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare environment
        uses: ./.github/actions/prepare

      - name: Run tests with coverage
        run: pnpm --dir extension test:coverage

      # GitHub Free does not expose organization secrets to private repositories, so the token may be absent.
      - name: Check Codecov token
        id: codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Codecov upload skipped::CODECOV_TOKEN is not available to this repository. Add it as a repository secret to upload coverage."
          fi

      - name: Upload coverage to Codecov
        if: steps.codecov.outputs.available == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          files: ./extension/coverage/lcov.info
          flags: unittests
          disable_search: true
          fail_ci_if_error: true
