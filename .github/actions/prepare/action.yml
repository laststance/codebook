name: Prepare
description: Install the pinned pnpm release (from extension/package.json packageManager), Node.js (from .node-version) and the extension's dependencies.

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: extension/package.json

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: pnpm
        cache-dependency-path: |
          extension/pnpm-lock.yaml
          extension/pnpm-workspace.yaml

    - name: Install dependencies
      run: pnpm --dir extension install --frozen-lockfile
      shell: bash
